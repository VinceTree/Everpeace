name: Windows native acceptance
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      RUNNER_READ_TOKEN:
        required: false
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/release/runner-availability.mjs
        env:
          GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
  native:
    needs: [availability]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, everpeace-native]
    timeout-minutes: 30
    env:
      EVERPEACE_NATIVE_REQUIRED: '1'
      EVERPEACE_NATIVE_MODE: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm install:verify
      - run: pnpm native:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/*
          if-no-files-found: error
  queue-watch:
    needs: [availability]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/release/queue-watch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
