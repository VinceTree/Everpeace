name: Validate candidate
on:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ''
      inject_windows_failure:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} · Node 22 · ${{ matrix.os == 'windows-2025' && 'full' || 'portable only' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      EVERPEACE_NATIVE_MODE: hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm install:verify
      - run: node scripts/release/check-workflows.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm ui:verify
      - run: pnpm docs:verify
      - name: Permit pinned Linux sandbox namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/everpeace-codex.apparmor"
          import { createRequire } from 'node:module';
          import { readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';
          const require = createRequire(import.meta.url);
          const launcher = createRequire(require.resolve('@openai/codex/bin/codex.js'));
          const manifest = launcher.resolve('@openai/codex-linux-x64/package.json');
          if (JSON.parse(readFileSync(manifest, 'utf8')).version !== '0.162.0-linux-x64') throw new Error('Re-audit native backend');
          const binary = realpathSync(path.join(path.dirname(manifest), 'vendor/x86_64-unknown-linux-musl/bin/codex'));
          console.log(`abi <abi/4.0>,\ninclude <tunables/global>\nprofile everpeace-ci-codex ${JSON.stringify(binary)} flags=(unconfined) {\n  userns,\n}`);
          NODE
          sudo apparmor_parser -r "$RUNNER_TEMP/everpeace-codex.apparmor"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Run tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            pnpm test 2>&1 | tee test-output.log
          else
            echo 'Native workspace files are unavailable here. This job checks portable behavior only.'
            pnpm test:portable 2>&1 | tee test-output.log
          fi
      - name: Windows release failure drill
        if: runner.os == 'Windows' && inputs.inject_windows_failure
        run: node --test tests/fixtures/release-failure.mjs
      - run: pnpm build
      - run: pnpm files:smoke
      - run: pnpm install:smoke
      - run: git diff --check
