name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node 22
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Run tests
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            excerpt="$(grep --after-context=35 --max-count=3 '^not ok' test-output.log || true)"
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            echo "::error title=Test failure::${excerpt:-pnpm test failed without a TAP failure block}"
          fi
          exit "$status"
      - run: pnpm build
      - name: Check whitespace
        shell: bash
        run: git diff --check
