name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  required:
    name: Required checks
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the entire platform matrix
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
