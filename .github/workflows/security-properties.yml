name: Daily security properties
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: read
jobs:
  properties:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0
      - run: pnpm install --frozen-lockfile
      - name: Run every invariant at ten times the PR count
        env:
          EVERPEACE_PROPERTY_DAILY: '1'
          EVERPEACE_PROPERTY_SEED: ${{ github.run_id }}
          EVERPEACE_PROPERTY_REPORT: ${{ runner.temp }}/property-evidence
        run: pnpm exec tsx --test tests/unit/security/properties.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: properties-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/property-evidence/*.json
          if-no-files-found: error
